services:
  mysql:
    image: mysql:8.4
    container_name: citago-mysql
    restart: unless-stopped
    ports:
      - '${DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-citago_dev}
      MYSQL_DATABASE: ${DB_DATABASE:-citago}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - citago-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p${DB_PASSWORD:-citago_dev}']
      interval: 5s
      timeout: 5s
      retries: 20

  # Separate instance for integration and e2e tests: a test run must never be
  # able to truncate the development database.
  mysql-test:
    image: mysql:8.4
    container_name: citago-mysql-test
    restart: unless-stopped
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: citago_test
      MYSQL_DATABASE: citago_test
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pcitago_test']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  citago-mysql-data:
